name: Produce exact MoreRecords-derived LessRecords icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-source-icon.yml
      - scripts/recolor_more_records_icon.py

permissions:
  contents: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LessRecords
      - uses: actions/checkout@v4
        with:
          repository: derhopp/MoreRecords
          ref: main
          path: MoreRecords
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pillow
      - name: Recolor precisely three pillars and create a Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python LessRecords/scripts/recolor_more_records_icon.py
