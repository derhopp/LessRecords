name: Inspect upstream MoreRecords icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-source-icon.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: derhopp/MoreRecords
          ref: main
          path: MoreRecords
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pillow
      - name: Inspect pixel geometry, without modifying the original logo
        run: |
          python - <<'PY'
          from collections import Counter
          from PIL import Image

          path = "MoreRecords/custom_components/more_records/brand/icon.png"
          im = Image.open(path).convert("RGBA")
          w, h = im.size
          bg = im.getpixel((0, 0))
          def fg(p):
              return p[3] > 30 if bg[3] < 30 else max(
                  abs(p[i] - bg[i]) for i in range(3)
              ) > 30
          counts = [sum(fg(im.getpixel((x,y))) for y in range(h)) for x in range(w)]
          runs = []
          start = None
          for x, count in enumerate(counts + [0]):
              visible = count >= max(2, h // 70)
              if visible and start is None:
                  start = x
              if not visible and start is not None:
                  runs.append([start, x - 1, max(counts[start:x])])
                  start = None
          palette = Counter(
              im.getpixel((x,y)) for x in range(w) for y in range(h)
          ).most_common(12)
          print("DIMENSIONS", im.size, "BACKGROUND", bg)
          print("PIXEL_COLUMN_RUNS", runs)
          print("COMMON_COLORS", palette)
          print("BINARY_PREVIEW")
          for py in range(32):
              y = min(h - 1, (py * h + h // 64) // 32)
              print("".join(
                  "##" if fg(im.getpixel((
                      min(w - 1, (px*w+w//64)//32), y
                  ))) else "  "
                  for px in range(32)
              ))
          PY
