name: Validate LessRecords

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Functional and safety tests (Home Assistant 2026.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Compile all integration Python modules
        run: python -m compileall -q custom_components tests
      - name: Validate translation and manifest JSON
        run: |
          python -m json.tool custom_components/less_records/manifest.json >/dev/null
          python -m json.tool custom_components/less_records/translations/en.json >/dev/null
          python -m json.tool custom_components/less_records/translations/de.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Functional and destructive-safety regression tests
        run: python -m pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS / Marketplace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  prerelease_0_1_0b2:
    name: Publish explicitly requested 0.1.0b2 pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: less-records-prerelease-0-1-0b2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish pre-release once, only after all validation gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view 0.1.0b2 >/dev/null 2>&1; then
            echo "Pre-release 0.1.0b2 already exists; no action."
            exit 0
          fi
          gh release create 0.1.0b2 \
            --target "$GITHUB_SHA" \
            --title "LessRecords 0.1.0b2" \
            --notes-file docs/RELEASE_0.1.0b2.md \
            --prerelease

